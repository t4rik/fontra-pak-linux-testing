id: xyz.fontra.FontraPak
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.7'
command: fontrapak

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=host

# flatpak-pip-generator (from PyPI: flatpak-pip-generator) refuses to touch
# requirements that include PyQt, and points at this BaseApp instead - see
# https://github.com/flathub/com.riverbankcomputing.PyQt.BaseApp. That's why
# PyQt6/PyQt6-Qt6/PyQt6-sip are absent from requirements below: the BaseApp
# supplies them, built against org.kde.Platform's actual Qt6 rather than a
# bundled-Qt wheel.

modules:
  # flatpak_pip_generator refuses to emit a module for setuptools ("setuptools
  # is in system_packages. Skipping.") on the assumption the SDK's own copy is
  # adequate. It isn't: org.kde.Sdk 6.7's bundled setuptools is too old to
  # parse PEP 639 SPDX-string `license = "Apache-2.0"` metadata, which several
  # of fonttools' own dependencies (unicodedata2, at minimum) now use. Since
  # every module below builds with --no-build-isolation - meaning it uses
  # whatever setuptools is already in /app, not a fresh isolated one - this
  # has to be upgraded first, before any module that needs it.
  #
  # Confirmed against an actual flatpak-builder run in CI: without this,
  # python3-fonttools fails with "configuration error: `project.license` must
  # be valid exactly by one definition" while building unicodedata2's wheel.
  - name: python3-setuptools
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --ignore-installed --prefix=${FLATPAK_DEST} "setuptools-84.0.0-py3-none-any.whl"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/95/9c/c510029fc6ef33a6275cd2c5d3cecd6613dfd6aa401d57c54f1c18852ccf/setuptools-84.0.0-py3-none-any.whl
        sha256: 51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670

  # Generated with:
  #   pip install flatpak-pip-generator
  #   flatpak_pip_generator --requirements-file=<(printf '%s\n' \
  #     aiohttp==3.14.3 setuptools==84.0.0 psutil==7.2.2 certifi==2026.7.22 \
  #     cattrs fonttools[ufo,unicode,woff] watchfiles pyyaml ufomerge \
  #     skia-pathops pillow ufo2ft fontmake fontc cffsubr glyphsLib) \
  #     --output shared-modules-pip-deps
  #
  # Covers every non-PyQt PyPI dependency of fontra-pak itself plus the
  # transitive deps of fontra/fontra-compile/fontra-rcjk/fontra-glyphs
  # (their pyproject.toml files, read directly, are what produced this list).
  # All 15 resolved to prebuilt manylinux wheels, including the compiled ones
  # (skia-pathops, fontc, lxml) - no build-from-source needed for any of them.
  # Re-run the command above and replace this file when fontra-pak's
  # requirements.txt changes.
  - shared-modules-pip-deps.json

  # fontra-pak's requirements.txt installs these four straight from git with
  # no version pin (`git+https://github.com/fontra/...`), and none of the
  # three below even have tags - upstream's own build isn't reproducible
  # here either, this manifest is just making the pin explicit instead of
  # implicit. `fontra` itself does have tags, so it's pinned to 2026.9.0
  # to match the fontra-pak release this manifest otherwise tracks; the
  # other three are pinned to whatever HEAD was at scaffold time. All will
  # drift from upstream's actual "current main" over time - re-check
  # `git ls-remote` for each and bump before relying on this for a real
  # release.
  - name: fontra
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --ignore-installed --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/fontra/fontra.git
        tag: 2026.9.0

  - name: fontra-compile
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --ignore-installed --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/fontra/fontra-compile.git
        commit: 8186c643d673d1a14e5f166941b30ef913b2101d # HEAD as of 2026-09-22, no tags exist

  - name: fontra-rcjk
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --ignore-installed --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/fontra/fontra-rcjk.git
        commit: bf0c69c1a8acde230ac927fec10d32a5335d5d3b # HEAD as of 2026-09-22, no tags exist

  - name: fontra-glyphs
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --ignore-installed --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/fontra/fontra-glyphs.git
        commit: 23e062781737d5a6700bcfdae11a432b666a6282 # HEAD as of 2026-09-22, no tags exist

  # fontra-pak itself is not pip-installable (no pyproject.toml/setup.py -
  # FontraPakMain.py is run directly, PyInstaller is what packages it for
  # the official release). So this just drops the script into /app and
  # writes a launcher, rather than pip-installing "fontra-pak".
  - name: fontrapak
    buildsystem: simple
    build-commands:
      - install -Dm755 FontraPakMain.py ${FLATPAK_DEST}/lib/fontrapak/FontraPakMain.py
      - install -Dm644 xyz.fontra.FontraPak.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/xyz.fontra.FontraPak.svg
      - install -Dm644 xyz.fontra.FontraPak.desktop ${FLATPAK_DEST}/share/applications/xyz.fontra.FontraPak.desktop
      - install -Dm644 xyz.fontra.FontraPak.metainfo.xml ${FLATPAK_DEST}/share/metainfo/xyz.fontra.FontraPak.metainfo.xml
      - |
        install -Dm755 /dev/stdin ${FLATPAK_DEST}/bin/fontrapak << 'EOF'
        #!/bin/sh
        exec python3 ${FLATPAK_DEST}/lib/fontrapak/FontraPakMain.py "$@"
        EOF
    sources:
      - type: git
        url: https://github.com/fontra/fontra-pak.git
        tag: 2026.9.0
      - type: file
        path: data/icons/xyz.fontra.FontraPak.svg
      - type: file
        path: xyz.fontra.FontraPak.desktop
      - type: file
        path: xyz.fontra.FontraPak.metainfo.xml
